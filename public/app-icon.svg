<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- アイコン背景グラデーション（深みのあるフォレスト〜エメラルドグリーン） -->
    <linearGradient id="bgGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1f6e52"/>
      <stop offset="35%" stop-color="#13523c"/>
      <stop offset="75%" stop-color="#0b3828"/>
      <stop offset="100%" stop-color="#052419"/>
    </linearGradient>

    <!-- アイコン表面のソフトな天面ライト -->
    <radialGradient id="surfaceLight" cx="35%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- アイコン境界のベベル光彩 -->
    <linearGradient id="bevelStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- アイコンの外部ドロップシャドウ -->
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#02140d" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010a07" flood-opacity="0.4"/>
    </filter>

    <!-- 本の立体ドロップシャドウ -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#021a11" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- ページ背表紙の陰影グラデーション -->
    <linearGradient id="pageShineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f5f5"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="95%" stop-color="#eaebeb"/>
      <stop offset="100%" stop-color="#c5c9c7"/>
    </linearGradient>

    <linearGradient id="pageShineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5c9c7"/>
      <stop offset="5%" stop-color="#eaebeb"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f5"/>
    </linearGradient>

    <!-- 下層ページのエッジ色 -->
    <linearGradient id="underPageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dce1de"/>
      <stop offset="100%" stop-color="#a8b2ad"/>
    </linearGradient>
  </defs>

  <!-- 角丸アイコン外枠（シャドウ付き） -->
  <g filter="url(#iconShadow)">
    <rect x="36" y="36" width="440" height="440" rx="105" ry="105" fill="url(#bgGrad)"/>
    <rect x="36" y="36" width="440" height="440" rx="105" ry="105" fill="url(#surfaceLight)"/>
    <!-- エッジのベベルストローク -->
    <rect x="37" y="37" width="438" height="438" rx="104" ry="104" fill="none" stroke="url(#bevelStroke)" stroke-width="2.5"/>
  </g>

  <!-- 中央の白いオープンブック（立体シャドウ付き） -->
  <g filter="url(#bookShadow)">
    <!-- 下層ページの縁（立体的重なり） -->
    <!-- 左下層ページ -->
    <path d="M 125 170 C 125 170 120 325 130 338 C 145 352 188 358 244 365 L 244 353 C 192 346 150 338 139 324 C 135 316 137 170 137 170 Z" fill="url(#underPageGrad)" opacity="0.95"/>
    <!-- 右下層ページ -->
    <path d="M 387 170 C 387 170 392 325 382 338 C 367 352 324 358 268 365 L 268 353 C 320 346 362 338 373 324 C 377 316 375 170 375 170 Z" fill="url(#underPageGrad)" opacity="0.95"/>

    <!-- メインの左ページ -->
    <path d="M 136 152 C 185 158 226 172 250 186 L 250 348 C 224 332 182 320 136 314 C 134 260 134 200 136 152 Z" fill="url(#pageShineL)"/>

    <!-- メインの右ページ -->
    <path d="M 376 152 C 327 158 286 172 262 186 L 262 348 C 288 332 330 320 376 314 C 378 260 378 200 376 152 Z" fill="url(#pageShineR)"/>

    <!-- ページ中央の背表紙の立体溝シャドウ -->
    <path d="M 250 186 L 262 186 L 262 348 L 250 348 Z" fill="#9ea5a1" opacity="0.4"/>

    <!-- 左ページのテキスト行（6本） -->
    <g fill="#0e4b36" opacity="0.88">
      <rect x="156" y="180" width="68" height="7.5" rx="3.75"/>
      <rect x="156" y="202" width="68" height="7.5" rx="3.75"/>
      <rect x="156" y="224" width="68" height="7.5" rx="3.75"/>
      <rect x="156" y="246" width="68" height="7.5" rx="3.75"/>
      <rect x="156" y="268" width="68" height="7.5" rx="3.75"/>
      <rect x="156" y="290" width="68" height="7.5" rx="3.75"/>
    </g>

    <!-- 右ページのテキスト行（6本） -->
    <g fill="#0e4b36" opacity="0.88">
      <rect x="288" y="180" width="68" height="7.5" rx="3.75"/>
      <rect x="288" y="202" width="68" height="7.5" rx="3.75"/>
      <rect x="288" y="224" width="68" height="7.5" rx="3.75"/>
      <rect x="288" y="246" width="68" height="7.5" rx="3.75"/>
      <rect x="288" y="268" width="68" height="7.5" rx="3.75"/>
      <rect x="288" y="290" width="68" height="7.5" rx="3.75"/>
    </g>
  </g>
</svg>
